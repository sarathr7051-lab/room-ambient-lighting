<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
  <title>Breadboard layout for the desk node</title>
  <desc>Plus 5 volt rail on top, ground rail below. Left to right: 1000 uF across the rails, ESP32, 74HCT125, 330 ohm resistor, WS2812 strip.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #1a1a18; }
    .t  { font-size: 14px; font-weight: 400; fill: #3d3d3a; }
    .ts { font-size: 12px; font-weight: 400; fill: #6b6b66; }
    .body { fill: #f2f1ed; stroke: #8a8a82; stroke-width: 0.8; }
    .ink   { stroke: #3d3d3a; fill: none; }
    .faint { stroke: #9a9891; fill: none; }
    .gnd   { stroke: #3d3d3a; }
    .gndf  { fill: #3d3d3a; }
    @media (prefers-color-scheme: dark) {
      .th { fill: #f5f3ee; }
      .t  { fill: #d6d3cc; }
      .ts { fill: #9a9891; }
      .body { fill: #2a2a2e; stroke: #77756e; }
      .ink   { stroke: #d6d3cc; }
      .faint { stroke: #77756e; }
      .gnd   { stroke: #d6d3cc; }
      .gndf  { fill: #d6d3cc; }
    }
  </style>
  <text class="th" x="40" y="50">Breadboard layout - red up, black down, green across</text>

  <line x1="55" y1="275" x2="645" y2="275" class="faint" stroke-dasharray="5 5"/>
  <line x1="55" y1="105" x2="645" y2="105" stroke="#DC3545" stroke-width="3" stroke-linecap="round"/>
  <text class="ts" x="55" y="90">+5 V rail - adapter's + lead</text>
  <line x1="55" y1="445" x2="645" y2="445" class="gnd" stroke-width="3" stroke-linecap="round"/>
  <text class="ts" x="55" y="466">GND rail - adapter's - lead</text>

  <g class="faint" stroke-width="1.5">
    <line x1="80" y1="252" x2="80" y2="105"/>
    <line x1="80" y1="296" x2="80" y2="445"/>
  </g>
  <rect x="72" y="252" width="16" height="44" rx="3" class="faint"/>
  <text class="ts" x="93" y="262" dominant-baseline="central">+</text>
  <text class="ts" x="80" y="322" text-anchor="middle">1000 uF</text>

  <line x1="155" y1="215" x2="155" y2="105" stroke="#DC3545" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="148" y="172" text-anchor="end" dominant-baseline="central">VIN</text>
  <line x1="200" y1="335" x2="200" y2="445" class="gnd" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="209" y="388" dominant-baseline="central">GND</text>

  <line x1="270" y1="251" x2="360" y2="251" stroke="#2E9E5B" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="315" y="236" text-anchor="middle">D16 -&gt; pin 2</text>

  <line x1="390" y1="230" x2="390" y2="105" stroke="#DC3545" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="383" y="172" text-anchor="end" dominant-baseline="central">pin 14</text>
  <line x1="435" y1="320" x2="435" y2="445" class="gnd" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="444" y="376" dominant-baseline="central">pin 7 + unused</text>
  <text class="ts" x="444" y="394" dominant-baseline="central">1, 4, 5, 9, 10, 12, 13</text>

  <line x1="465" y1="251" x2="495" y2="251" stroke="#2E9E5B" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="470" y="234" dominant-baseline="central">pin 3</text>
  <rect x="495" y="244" width="36" height="14" rx="3" class="faint"/>
  <text class="t" x="513" y="300" text-anchor="middle">330 ohm</text>
  <line x1="531" y1="251" x2="562" y2="251" stroke="#2E9E5B" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="558" y="234" text-anchor="end" dominant-baseline="central">DIN</text>

  <line x1="590" y1="215" x2="590" y2="105" stroke="#DC3545" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="583" y="172" text-anchor="end" dominant-baseline="central">+5V</text>
  <line x1="618" y1="335" x2="618" y2="445" class="gnd" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t" x="627" y="388" dominant-baseline="central">GND</text>

  <rect x="120" y="215" width="150" height="120" rx="6" class="body"/>
  <text class="th" x="195" y="262" text-anchor="middle" dominant-baseline="central">ESP32</text>
  <text class="ts" x="195" y="282" text-anchor="middle" dominant-baseline="central">DevKit V1</text>

  <rect x="360" y="230" width="105" height="90" rx="6" class="body"/>
  <text class="th" x="412" y="266" text-anchor="middle" dominant-baseline="central">74HCT125</text>
  <text class="ts" x="412" y="286" text-anchor="middle" dominant-baseline="central">notch up</text>

  <rect x="562" y="215" width="78" height="120" rx="6" class="body"/>
  <text class="th" x="601" y="262" text-anchor="middle" dominant-baseline="central">WS2812</text>
  <text class="ts" x="601" y="282" text-anchor="middle" dominant-baseline="central">uncut, 3 m</text>

  <text class="t" x="40" y="500">Dashed line = the centre channel. Both chips straddle it. Resistor and</text>
  <text class="t" x="40" y="522">capacitor legs go straight into the rows - no jumper wires for those.</text>
  <text class="th" x="40" y="546">Pin names vary between ESP32 clones - find VIN, GND and D16 on the silkscreen.</text>
</svg>
