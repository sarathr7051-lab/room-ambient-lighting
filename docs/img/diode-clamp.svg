<svg xmlns="http://www.w3.org/2000/svg" width="680" height="717" viewBox="0 0 680 717" role="img">
  <title>Diode clamp wiring</title>
  <desc>Five volt rail on top, ground rail below. The ESP32 drives RX2 through a 1N4007 whose silver band faces the ESP32, into a junction pulled up to five volts by a 470 ohm resistor. That junction feeds the strip data input.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h  { font-size: 15px; font-weight: 600; fill: #1a1a18; }
    .t  { font-size: 13px; font-weight: 400; fill: #3d3d3a; }
    .n  { font-size: 12px; font-weight: 600; fill: #1a1a18; }
    .body { fill: #eeece7; stroke: #6f6d66; stroke-width: 1.2; }
    .gnd { stroke: #4a4844; } .gndf { fill: #4a4844; }
  </style>
  <rect x="0" y="0" width="680" height="100%" fill="#ffffff"/>
  <text class="t" x="630" y="54" text-anchor="end">The 5 V 3 A adapter feeds these two rails through the pigtail.</text>
  <rect x="50" y="71" width="580" height="18" rx="9" fill="#DC3545" opacity="0.9"/>
  <text class="h" x="64" y="80" dominant-baseline="central" style="fill:#ffffff">5 V rail</text>
  <rect x="50" y="421" width="580" height="18" rx="9" class="gndf"/>
  <text class="h" x="64" y="430" dominant-baseline="central" style="fill:#ffffff">GND rail</text>
  <path d="M104 80 L104 236" fill="none" class="gnd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M104 292 L104 430" fill="none" class="gnd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="88" y="236" width="32" height="56" rx="5" fill="#2f3a52" stroke="#1b2233" stroke-width="1"/>
  <rect x="90" y="238" width="9" height="52" rx="4" fill="#cdd6e6"/>
  <text class="n" x="130" y="228" dominant-baseline="central">1000 uF</text>
  <text class="t" x="130" y="248" dominant-baseline="central">LONG leg -&gt; 5 V rail</text>
  <text class="t" x="130" y="266" dominant-baseline="central">SHORT leg -&gt; GND rail</text>
  <text class="t" x="130" y="286" dominant-baseline="central" style="fill:#DC3545">the stripe is on</text>
  <text class="t" x="130" y="302" dominant-baseline="central" style="fill:#DC3545">the SHORT leg side</text>
  <path d="M104 236 L104 224 L122 224" fill="none" stroke="#DC3545" stroke-width="1.6"/>
  <path d="M218 196 L218 80" fill="none" stroke="#DC3545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="218" cy="196" r="4.5" fill="#DC3545"/>
  <path d="M252 336 L252 430" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="252" cy="336" r="4.5" class="gndf"/>
  <rect x="190" y="196" width="110" height="140" rx="6" class="body"/>
  <text class="t" x="245" y="266" text-anchor="middle" dominant-baseline="central">ESP32</text>
  <text class="n" x="224" y="182">VIN</text>
  <text class="n" x="258" y="352">GND</text>
  <text class="n" x="292" y="246" text-anchor="end">RX2</text>
  <path d="M300 264 L322 264" fill="none" stroke="#2E9E5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="253" width="52" height="22" rx="5" fill="#26262a" stroke="#101013" stroke-width="1"/>
  <rect x="325" y="253" width="8" height="22" fill="#d8d8d8"/>
  <path d="M374 264 L420 264" fill="none" stroke="#2E9E5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="n" x="348" y="294" text-anchor="middle">1N4007</text>
  <path d="M329 277 L329 308 L318 308" fill="none" stroke="#DC3545" stroke-width="2"/>
  <text class="t" x="292" y="316" style="fill:#DC3545">silver band on THIS side</text>
  <circle cx="420" cy="264" r="4.5" fill="#2E9E5B"/>
  <text class="t" x="420" y="290" text-anchor="middle">junction</text>
  <path d="M420 264 L420 190" fill="none" stroke="#DC3545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M420 142 L420 80" fill="none" stroke="#DC3545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="409" y="142" width="22" height="48" rx="8" fill="#d8c9a8" stroke="#8a7c5e" stroke-width="1"/>
  <rect x="409" y="150" width="22" height="5" fill="#e08a0c"/>
  <rect x="409" y="161" width="22" height="5" fill="#6b3f1d"/>
  <rect x="409" y="172" width="22" height="5" fill="#8a5a2b"/>
  <text class="t" x="440" y="166" dominant-baseline="central">470 ohm</text>
  <text class="t" x="440" y="184" dominant-baseline="central">(330 also fine)</text>
  <path d="M420 264 L480 264" fill="none" stroke="#2E9E5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M534 196 L534 80" fill="none" stroke="#DC3545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="534" cy="196" r="4.5" fill="#DC3545"/>
  <path d="M578 336 L578 430" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="578" cy="336" r="4.5" class="gndf"/>
  <rect x="480" y="196" width="138" height="140" rx="6" class="body"/>
  <text class="t" x="549" y="257" text-anchor="middle" dominant-baseline="central">WS2812 strip</text>
  <text class="t" x="549" y="277" text-anchor="middle" dominant-baseline="central">uncut, unrolled</text>
  <text class="n" x="488" y="254">DIN</text>
  <text class="n" x="540" y="182">+5V</text>
  <text class="n" x="584" y="352">GND</text>
  <text class="h" x="50" y="474">What this does</text>
  <text class="t" x="50" y="496">The 470 ohm pulls the junction up toward 5 V. The diode lets RX2 drag it back down.</text>
  <text class="t" x="50" y="516">Result: a HIGH of about 3.8 V instead of 3.17 V - enough for the strip to read it.</text>
  <text class="h" x="50" y="546">The wires</text>
  <rect x="50" y="561" width="12" height="12" rx="3" fill="#DC3545"/>
  <text class="t" x="70" y="570" dominant-baseline="central">to the 5 V rail:  ESP32 VIN,  strip +5V,  top of the 470 ohm</text>
  <rect x="50" y="584" width="12" height="12" rx="3" class="gndf"/>
  <text class="t" x="70" y="593" dominant-baseline="central">to the GND rail:  ESP32 GND,  strip GND,  1000 uF striped leg</text>
  <rect x="50" y="607" width="12" height="12" rx="3" fill="#2E9E5B"/>
  <text class="t" x="70" y="616" dominant-baseline="central">signal:  RX2  ->  diode  ->  junction  ->  strip DIN</text>
  <text class="h" x="50" y="647" style="fill:#DC3545">Diode backwards = nothing lights. Silver band faces the ESP32.</text>
  <text class="h" x="50" y="669" style="fill:#DC3545">Capacitor backwards across 5 V can burst. Long leg to +, short leg to GND.</text>
  <text class="t" x="50" y="691">Strip power goes straight to the pigtail, never through the breadboard rails.</text>
</svg>
