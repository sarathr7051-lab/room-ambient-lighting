<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
  <title>How a WS2812 corner joint is wired</title>
  <desc>A side run meeting a top run at ninety degrees, bridged by three short wires: red for plus 5 volts, green for data from DO to DI, black for ground.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #1a1a18; }
    .t  { font-size: 14px; font-weight: 400; fill: #3d3d3a; }
    .ts { font-size: 12px; font-weight: 400; fill: #6b6b66; }
    .body { fill: #f2f1ed; stroke: #8a8a82; stroke-width: 0.8; }
    .ink   { stroke: #3d3d3a; fill: none; }
    .faint { stroke: #9a9891; fill: none; }
    .gnd   { stroke: #3d3d3a; }
    .gndf  { fill: #3d3d3a; }
    @media (prefers-color-scheme: dark) {
      .th { fill: #f5f3ee; }
      .t  { fill: #d6d3cc; }
      .ts { fill: #9a9891; }
      .body { fill: #2a2a2e; stroke: #77756e; }
      .ink   { stroke: #d6d3cc; }
      .faint { stroke: #77756e; }
      .gnd   { stroke: #d6d3cc; }
      .gndf  { fill: #d6d3cc; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text class="th" x="40" y="56">One corner - three wires, each under 3 cm</text>

  <rect x="100" y="200" width="46" height="150" rx="4" class="body"/>
  <text class="ts" x="123" y="372" text-anchor="middle">side run - 18 LEDs</text>
  <rect x="380" y="90" width="200" height="46" rx="4" class="body"/>
  <text class="ts" x="480" y="158" text-anchor="middle">top run - 34 LEDs</text>

  <line x1="123" y1="340" x2="123" y2="228" class="faint" marker-end="url(#a)"/>
  <line x1="410" y1="113" x2="562" y2="113" class="faint" marker-end="url(#a)"/>

  <path d="M110 212 C 190 205 300 102 392 102" fill="none" stroke="#DC3545" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M123 212 C 200 210 305 115 392 115" fill="none" stroke="#2E9E5B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M136 212 C 215 215 310 128 392 128" class="gnd" fill="none" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="110" cy="212" r="4" fill="#DC3545"/><circle cx="392" cy="102" r="4" fill="#DC3545"/>
  <circle cx="123" cy="212" r="4" fill="#2E9E5B"/><circle cx="392" cy="115" r="4" fill="#2E9E5B"/>
  <circle cx="136" cy="212" r="4" class="gndf"/><circle cx="392" cy="128" r="4" class="gndf"/>

  <rect x="430" y="202" width="14" height="14" rx="3" fill="#DC3545"/>
  <text class="t" x="456" y="209" dominant-baseline="central">red - +5 V to +5 V</text>
  <rect x="430" y="230" width="14" height="14" rx="3" fill="#2E9E5B"/>
  <text class="t" x="456" y="237" dominant-baseline="central">green - DO to DI</text>
  <rect x="430" y="258" width="14" height="14" rx="3" class="gndf"/>
  <text class="t" x="456" y="265" dominant-baseline="central">black - GND to GND</text>

  <text class="t" x="40" y="400">Match pad NAMES, not positions - at a corner one strip is turned 90 degrees.</text>
  <text class="t" x="40" y="422">Tin both pads first. Iron on each pad 1-2 seconds, never longer.</text>
</svg>
