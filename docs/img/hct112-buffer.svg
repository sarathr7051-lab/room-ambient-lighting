<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
  <title>CD74HCT112E wired as a two-stage non-inverting level-shifting buffer</title>
  <desc>A 16-pin DIP. Both set inputs are held low, so each complement output
  follows the inverse of its reset input. Two stages in series make a
  non-inverting 3.3 V to 5 V buffer with HCT input thresholds.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #1a1a18; }
    .t  { font-size: 14px; font-weight: 400; fill: #3d3d3a; }
    .ts { font-size: 12px; font-weight: 400; fill: #6b6b66; }
    .body { fill: #f2f1ed; stroke: #8a8a82; stroke-width: 0.8; }
    .faint { stroke: #9a9891; fill: none; }
    .gnd { stroke: #3d3d3a; } .gndf { fill: #3d3d3a; }
    @media (prefers-color-scheme: dark) {
      .th { fill: #f5f3ee; } .t { fill: #d6d3cc; } .ts { fill: #9a9891; }
      .body { fill: #2a2a2e; stroke: #77756e; }
      .faint { stroke: #77756e; }
      .gnd { stroke: #d6d3cc; } .gndf { fill: #d6d3cc; }
    }
  </style>
  <text class="th" x="40" y="52">CD74HCT112E as a level-shifting buffer</text>
  <text class="ts" x="40" y="72">Both SET inputs tied low. Qbar then follows NOT(RD). Two stages = non-inverting.</text>

  <rect x="280" y="130" width="120" height="215" rx="6" class="body"/>
  <path d="M328 130 A 12 12 0 0 0 352 130" class="faint"/>
  <circle cx="294" cy="146" r="3.5" class="gndf"/>

  <g class="faint">
    <line x1="280" y1="150" x2="262" y2="150"/><line x1="400" y1="150" x2="418" y2="150"/>
    <line x1="280" y1="175" x2="262" y2="175"/><line x1="400" y1="175" x2="418" y2="175"/>
    <line x1="280" y1="200" x2="262" y2="200"/><line x1="400" y1="200" x2="418" y2="200"/>
    <line x1="280" y1="225" x2="262" y2="225"/><line x1="400" y1="225" x2="418" y2="225"/>
    <line x1="280" y1="250" x2="262" y2="250"/><line x1="400" y1="250" x2="418" y2="250"/>
    <line x1="280" y1="275" x2="262" y2="275"/><line x1="400" y1="275" x2="418" y2="275"/>
    <line x1="280" y1="300" x2="262" y2="300"/><line x1="400" y1="300" x2="418" y2="300"/>
    <line x1="280" y1="325" x2="262" y2="325"/><line x1="400" y1="325" x2="418" y2="325"/>
  </g>

  <circle cx="256" cy="150" r="4" class="gndf"/>
  <circle cx="256" cy="175" r="4" class="gndf"/>
  <circle cx="256" cy="200" r="4" class="gndf"/>
  <circle cx="256" cy="225" r="4" class="gndf"/>
  <circle cx="256" cy="250" r="4" fill="#9a9891"/>
  <circle cx="256" cy="275" r="4" fill="#2E9E5B"/>
  <circle cx="256" cy="300" r="4" fill="#2E9E5B"/>
  <circle cx="256" cy="325" r="4" class="gndf"/>
  <circle cx="424" cy="150" r="4" fill="#DC3545"/>
  <circle cx="424" cy="175" r="4" fill="#2E9E5B"/>
  <circle cx="424" cy="200" r="4" fill="#2E9E5B"/>
  <circle cx="424" cy="225" r="4" class="gndf"/>
  <circle cx="424" cy="250" r="4" class="gndf"/>
  <circle cx="424" cy="275" r="4" class="gndf"/>
  <circle cx="424" cy="300" r="4" class="gndf"/>
  <circle cx="424" cy="325" r="4" fill="#9a9891"/>

  <text class="ts" x="292" y="150" dominant-baseline="central">1</text>
  <text class="ts" x="292" y="175" dominant-baseline="central">2</text>
  <text class="ts" x="292" y="200" dominant-baseline="central">3</text>
  <text class="ts" x="292" y="225" dominant-baseline="central">4</text>
  <text class="ts" x="292" y="250" dominant-baseline="central">5</text>
  <text class="ts" x="292" y="275" dominant-baseline="central">6</text>
  <text class="ts" x="292" y="300" dominant-baseline="central">7</text>
  <text class="ts" x="292" y="325" dominant-baseline="central">8</text>
  <text class="ts" x="388" y="150" text-anchor="end" dominant-baseline="central">16</text>
  <text class="ts" x="388" y="175" text-anchor="end" dominant-baseline="central">15</text>
  <text class="ts" x="388" y="200" text-anchor="end" dominant-baseline="central">14</text>
  <text class="ts" x="388" y="225" text-anchor="end" dominant-baseline="central">13</text>
  <text class="ts" x="388" y="250" text-anchor="end" dominant-baseline="central">12</text>
  <text class="ts" x="388" y="275" text-anchor="end" dominant-baseline="central">11</text>
  <text class="ts" x="388" y="300" text-anchor="end" dominant-baseline="central">10</text>
  <text class="ts" x="388" y="325" text-anchor="end" dominant-baseline="central">9</text>

  <text class="t" x="244" y="150" text-anchor="end" dominant-baseline="central">1CP -> GND</text>
  <text class="t" x="244" y="175" text-anchor="end" dominant-baseline="central">1K -> GND</text>
  <text class="t" x="244" y="200" text-anchor="end" dominant-baseline="central">1J -> GND</text>
  <text class="t" x="244" y="225" text-anchor="end" dominant-baseline="central">1SD -> GND  (set, held low)</text>
  <text class="t" x="244" y="250" text-anchor="end" dominant-baseline="central">1Q leave open</text>
  <text class="t" x="244" y="275" text-anchor="end" dominant-baseline="central">1Qbar -> pin 14</text>
  <text class="t" x="244" y="300" text-anchor="end" dominant-baseline="central">2Qbar -> 100R -> strip DIN</text>
  <text class="t" x="244" y="325" text-anchor="end" dominant-baseline="central">GND -> GND rail</text>
  <text class="t" x="436" y="150" dominant-baseline="central">VCC -> +5 V</text>
  <text class="t" x="436" y="175" dominant-baseline="central">1RD &lt;- ESP32 GPIO16 (RX2)</text>
  <text class="t" x="436" y="200" dominant-baseline="central">2RD &lt;- pin 6</text>
  <text class="t" x="436" y="225" dominant-baseline="central">2CP -> GND</text>
  <text class="t" x="436" y="250" dominant-baseline="central">2K -> GND</text>
  <text class="t" x="436" y="275" dominant-baseline="central">2J -> GND</text>
  <text class="t" x="436" y="300" dominant-baseline="central">2SD -> GND  (set, held low)</text>
  <text class="t" x="436" y="325" dominant-baseline="central">2Q leave open</text>

  <text class="th" x="40" y="385">TEST IT FIRST - this works on TI silicon, NOT on Nexperia silicon.</text>
  <text class="t" x="40" y="407">Also fit 10 kohm from GPIO16 to GND, and 0.1 uF across pins 16 and 8.</text>
  <text class="t" x="40" y="429">Signal path: GPIO16 -&gt; pin 15 ... pin 6 -&gt; pin 14 ... pin 7 -&gt; 100R -&gt; DIN.</text>
  <text class="ts" x="40" y="451">Never leave a CMOS input floating - every unused input above goes to GND.</text>
</svg>
