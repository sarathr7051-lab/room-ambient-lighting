<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>Rail check with the meter</title><style>text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}.h{font-size:15px;font-weight:600;fill:#1a1a18}.t{font-size:13px;fill:#3d3d3a}.n{font-size:12px;font-weight:600;fill:#1a1a18}</style><rect x="0" y="0" width="680" height="470" fill="#ffffff"/><rect x="120" y="150" width="440" height="56" rx="4" fill="#26262a"/><rect x="120" y="156" width="440" height="8" fill="#DC3545" opacity="0.85"/><rect x="120" y="192" width="440" height="8" fill="#bdbdbd"/><rect x="150" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="172" y1="178" x2="180" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="202" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="224" y1="178" x2="232" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="254" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="276" y1="178" x2="284" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="306" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="328" y1="178" x2="336" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="358" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="380" y1="178" x2="388" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="410" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="432" y1="178" x2="440" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="462" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="484" y1="178" x2="492" y2="178" stroke="#2E9E5B" stroke-width="3"/><rect x="514" y="170" width="22" height="16" rx="2" fill="#f2f2f2" stroke="#888"/><line x1="536" y1="178" x2="544" y2="178" stroke="#2E9E5B" stroke-width="3"/><text class="t" x="340" y="224" text-anchor="middle">the strip, 2 m, seen from the LED side (only 8 of the 120 drawn)</text><rect x="116" y="154" width="14" height="12" fill="#d9a441" stroke="#8a6a20"/><text class="n" x="108" y="160" text-anchor="end" dominant-baseline="central" style="fill:#DC3545">+5V</text><rect x="116" y="172" width="14" height="12" fill="#d9a441" stroke="#8a6a20"/><text class="n" x="108" y="178" text-anchor="end" dominant-baseline="central" style="fill:#2E9E5B">Din</text><rect x="116" y="190" width="14" height="12" fill="#d9a441" stroke="#8a6a20"/><text class="n" x="108" y="196" text-anchor="end" dominant-baseline="central" style="fill:#777">GND</text><text class="h" x="112" y="118" text-anchor="end">bare pads</text><text class="t" x="112" y="136" text-anchor="end">(the Din end)</text><circle cx="560" cy="160" r="4" fill="#d9a441" stroke="#8a6a20"/><path d="M560 160 L610 160" stroke="#DC3545" stroke-width="3" fill="none"/><circle cx="560" cy="178" r="4" fill="#d9a441" stroke="#8a6a20"/><path d="M560 178 L610 178" stroke="#2E9E5B" stroke-width="3" fill="none"/><circle cx="560" cy="196" r="4" fill="#d9a441" stroke="#8a6a20"/><path d="M560 196 L610 196" stroke="#999" stroke-width="3" fill="none"/><rect x="610" y="152" width="24" height="52" rx="3" fill="#222"/><text class="h" x="622" y="118" text-anchor="middle">DO end</text><text class="t" x="622" y="136" text-anchor="middle">wires + plug</text><path d="M568 160 L538 90" stroke="#111" stroke-width="5" stroke-linecap="round"/><text class="n" x="538" y="80" text-anchor="middle" style="fill:#111">BLACK probe on the</text><text class="n" x="538" y="98" text-anchor="middle" style="fill:#111">solder blob of the RED wire</text><path d="M123 160 L163 90" stroke="#DC3545" stroke-width="5" stroke-linecap="round"/><text class="n" x="163" y="80" text-anchor="middle" style="fill:#DC3545">RED probe on each</text><text class="n" x="163" y="98" text-anchor="middle" style="fill:#DC3545">bare pad in turn</text><text class="h" x="40" y="256">Meter on the 2000 position of the Ω section, black in COM, red in VΩmA, nothing powered.</text><rect x="40" y="273" width="12" height="12" rx="3" fill="#DC3545"/><text class="t" x="60" y="282" dominant-baseline="central">RED wire  ->  pad that reads a small number (1 to 10)  =  +5V. Mark that edge.</text><rect x="40" y="297" width="12" height="12" rx="3" fill="#555"/><text class="t" x="60" y="306" dominant-baseline="central">WHITE wire  ->  pad that reads a small number  =  GND.</text><rect x="40" y="321" width="12" height="12" rx="3" fill="#2E9E5B"/><text class="t" x="60" y="330" dominant-baseline="central">GREEN wire  ->  reads  1  (blank) to every pad. Data is not a rail. That is correct.</text><text class="t" x="40" y="362">Touch the two probes together first: the display must drop to about 0. That proves the meter is on the right setting.</text><text class="t" x="40" y="384">A reading of 1 on the far left of the display means open circuit, not one ohm.</text><text class="h" x="40" y="414" style="fill:#DC3545">Then run a marker line along the +5V edge of the whole 2 m. Every cut tonight is read off that line.</text></svg>
