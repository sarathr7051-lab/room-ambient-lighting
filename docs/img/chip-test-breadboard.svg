<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img">
  <title>Chip test wiring</title>
  <desc>The 5 V rail runs across the top and the GND rail across the bottom. The chip sits on the left and the ESP32 on the right. Red wires go up to 5 V, dark wires down to GND, one amber jumper on pin 15 moves between the GND rail and the 3V3 row, and pin 6 is where the meter probes.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h  { font-size: 15px; font-weight: 600; fill: #1a1a18; }
    .t  { font-size: 13px; font-weight: 400; fill: #3d3d3a; }
    .n  { font-size: 12px; font-weight: 600; fill: #1a1a18; }
    .body { fill: #eeece7; stroke: #6f6d66; stroke-width: 1.2; }
    .gnd { stroke: #4a4844; } .gndf { fill: #4a4844; }
    @media (prefers-color-scheme: dark) {
      .h{fill:#f5f3ee;} .t{fill:#d6d3cc;} .n{fill:#f5f3ee;}
      .body{fill:#35353c;stroke:#9a9891;}
      .gnd{stroke:#b9b6ae;} .gndf{fill:#b9b6ae;}
    }
  </style>
  <text class="t" x="624" y="58" text-anchor="end">USB powers the ESP32. No adapter, no pigtail, no LED strip in this test.</text>
  <rect x="56" y="75" width="568" height="18" rx="9" fill="#DC3545" opacity="0.9"/>
  <text class="h" x="70" y="84" dominant-baseline="central" style="fill:#ffffff">5 V rail</text>
  <rect x="56" y="461" width="568" height="18" rx="9" class="gndf"/>
  <text class="h" x="70" y="470" dominant-baseline="central" style="fill:#ffffff">GND rail</text>
  <path d="M160 180 L70 180 L70 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="180" r="4" class="gndf"/>
  <path d="M160 208 L84 208 L84 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="208" r="4" class="gndf"/>
  <path d="M160 236 L98 236 L98 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="236" r="4" class="gndf"/>
  <path d="M160 264 L112 264 L112 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="264" r="4" class="gndf"/>
  <path d="M160 376 L126 376 L126 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="376" r="4" class="gndf"/>
  <path d="M300 236 L360 236 L360 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="236" r="4" class="gndf"/>
  <path d="M300 264 L374 264 L374 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="264" r="4" class="gndf"/>
  <path d="M300 292 L388 292 L388 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="292" r="4" class="gndf"/>
  <path d="M300 320 L402 320 L402 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="320" r="4" class="gndf"/>
  <path d="M300 348 L416 348 L416 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="348" r="4" class="gndf"/>
  <path d="M300 180 L332 180 L332 84" fill="none" stroke="#DC3545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="180" r="4" fill="#DC3545"/>
  <rect x="160" y="158" width="140" height="240" rx="6" class="body"/>
  <path d="M218 158 A 12 12 0 0 0 242 158" fill="none" class="gnd" stroke-width="1"/>
  <text class="n" x="171" y="180" dominant-baseline="central">1</text>
  <text class="n" x="289" y="180" text-anchor="end" dominant-baseline="central">16</text>
  <text class="n" x="171" y="208" dominant-baseline="central">2</text>
  <text class="n" x="289" y="208" text-anchor="end" dominant-baseline="central">15</text>
  <text class="n" x="171" y="236" dominant-baseline="central">3</text>
  <text class="n" x="289" y="236" text-anchor="end" dominant-baseline="central">14</text>
  <text class="n" x="171" y="264" dominant-baseline="central">4</text>
  <text class="n" x="289" y="264" text-anchor="end" dominant-baseline="central">13</text>
  <text class="n" x="171" y="292" dominant-baseline="central">5</text>
  <text class="n" x="289" y="292" text-anchor="end" dominant-baseline="central">12</text>
  <text class="n" x="171" y="320" dominant-baseline="central">6</text>
  <text class="n" x="289" y="320" text-anchor="end" dominant-baseline="central">11</text>
  <text class="n" x="171" y="348" dominant-baseline="central">7</text>
  <text class="n" x="289" y="348" text-anchor="end" dominant-baseline="central">10</text>
  <text class="n" x="171" y="376" dominant-baseline="central">8</text>
  <text class="n" x="289" y="376" text-anchor="end" dominant-baseline="central">9</text>
  <text class="t" x="230" y="410" text-anchor="middle">the chip</text>
  <polygon points="144,312 144,328 156,320" fill="#2E9E5B"/>
  <circle cx="171" cy="320" r="10" fill="none" stroke="#2E9E5B" stroke-width="2.5"/>
  <path d="M300 208 L348 208" fill="none" stroke="#E08A0C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="208" r="4" fill="#E08A0C"/>
  <circle cx="348" cy="208" r="4" fill="#E08A0C"/>
  <path d="M348 208 L348 470" fill="none" stroke="#E08A0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text class="h" x="340" y="446" text-anchor="end" style="fill:#E08A0C">A - do this first</text>
  <path d="M348 208 L440 208 L440 214 L462 214" fill="none" stroke="#E08A0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text class="h" x="400" y="194" text-anchor="middle" style="fill:#E08A0C">B - then move it here</text>
  <text class="t" x="352" y="228" style="fill:#E08A0C">ONE wire only. Never both at once.</text>
  <path d="M600 84 L600 470" fill="none" class="gnd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="592" y="264" width="16" height="26" rx="3" class="body"/>
  <text class="t" x="584" y="277" text-anchor="end" dominant-baseline="central">0.1 uF</text>
  <rect x="452" y="214" width="114" height="136" rx="6" class="body"/>
  <text class="t" x="509" y="282" text-anchor="middle" dominant-baseline="central">ESP32</text>
  <path d="M492 214 L492 84" fill="none" stroke="#DC3545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="492" cy="214" r="4" fill="#DC3545"/>
  <text class="n" x="498" y="200">VIN</text>
  <path d="M536 350 L536 470" fill="none" class="gnd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="536" cy="350" r="4" class="gndf"/>
  <text class="n" x="542" y="366">GND</text>
  <circle cx="462" cy="214" r="4" fill="#E08A0C"/>
  <text class="n" x="456" y="232" style="fill:#E08A0C">3V3 row</text>
  <text class="h" x="56" y="518">The wires</text>
  <rect x="56" y="535" width="12" height="12" rx="3" fill="#DC3545"/>
  <text class="t" x="76" y="544" dominant-baseline="central">to the 5 V rail:  chip pin 16,  ESP32 VIN</text>
  <rect x="56" y="558" width="12" height="12" rx="3" class="gndf"/>
  <text class="t" x="76" y="567" dominant-baseline="central">to the GND rail:  chip pins 1 2 3 4 8 10 11 12 13 14,  ESP32 GND</text>
  <rect x="56" y="581" width="12" height="12" rx="3" fill="#E08A0C"/>
  <text class="t" x="76" y="590" dominant-baseline="central">ONE jumper. One end stays in pin 15. UNPLUG the other end and move it: A, then B</text>
  <rect x="56" y="604" width="12" height="12" rx="3" fill="#2E9E5B"/>
  <text class="t" x="76" y="613" dominant-baseline="central">pin 6: no wire. Red meter lead into a free hole in pin 6's row</text>
  <text class="t" x="56" y="644">Black meter lead stays in the GND rail throughout. Bridge the two GND rails, and the two 5 V rails.</text>
</svg>
